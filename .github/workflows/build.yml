name: Build, publish, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  windows:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*Setup.exe
          if-no-files-found: error

  mac:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --break-system-packages Pillow
      - run: sh native-macos/build-mac.sh
      - run: codesign --force --deep --sign - 'dist/Playmaker Tackle.app'
      - run: codesign --verify --deep --strict 'dist/Playmaker Tackle.app'
      - run: ditto -c -k --sequesterRsrc --keepParent 'dist/Playmaker Tackle.app' 'Playmaker-Tackle-Mac.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: Playmaker-Tackle-Mac.zip
          if-no-files-found: error

  pages:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir site
          cp index.html styles.css features.css app.js features.js favicon.svg site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-app'
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
